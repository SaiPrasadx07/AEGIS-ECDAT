# Algorithm strings appearing inside factory arguments and cipher specifications.
# Java writes "AES/GCM/NoPadding"; Node writes "aes-256-cbc"; both resolve here.
algorithm_strings:
  AES:
    algorithm: AES
    family: Block cipher
    role: symmetric
  DES:
    algorithm: DES
    family: Block cipher
    role: symmetric
    legacy: true
  DESede:
    algorithm: Triple DES
    family: Block cipher
    role: symmetric
    legacy: true
  RSA:
    algorithm: RSA
    family: RSA
    role: key_establishment
  DSA:
    algorithm: DSA
    family: Finite field
    role: signature
  EC:
    algorithm: ECDSA
    family: Elliptic curve
    role: signature
  ECDSA:
    algorithm: ECDSA
    family: Elliptic curve
    role: signature
  ECDH:
    algorithm: ECDH
    family: Elliptic curve
    role: key_establishment
  DiffieHellman:
    algorithm: Diffie-Hellman
    family: Finite field
    role: key_establishment
  Ed25519:
    algorithm: Ed25519
    family: Elliptic curve
    role: signature
  X25519:
    algorithm: X25519
    family: Elliptic curve
    role: key_establishment
  MD5:
    algorithm: MD5
    family: Hash
    role: hash
    legacy: true
  SHA-1:
    algorithm: SHA-1
    family: Hash
    role: hash
    legacy: true
  SHA1:
    algorithm: SHA-1
    family: Hash
    role: hash
    legacy: true
  SHA-256:
    algorithm: SHA-256
    family: Hash
    role: hash
  SHA256:
    algorithm: SHA-256
    family: Hash
    role: hash
  SHA-384:
    algorithm: SHA-384
    family: Hash
    role: hash
  SHA-512:
    algorithm: SHA-512
    family: Hash
    role: hash
  SHA512:
    algorithm: SHA-512
    family: Hash
    role: hash
  ChaCha20:
    algorithm: ChaCha20
    family: Stream cipher
    role: symmetric
  ChaCha20-Poly1305:
    algorithm: ChaCha20-Poly1305
    family: Stream cipher
    role: symmetric
  SHA256withRSA:
    algorithm: RSA
    family: RSA
    role: signature
  SHA1withRSA:
    algorithm: RSA
    family: RSA
    role: signature
    legacy: true
    note: The SHA-1 digest makes this signature construction unsuitable; RSA itself is quantum-vulnerable, which is a separate concern.
  SHA256withECDSA:
