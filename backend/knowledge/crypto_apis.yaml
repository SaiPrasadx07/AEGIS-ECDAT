  ML-KEM-768:
    algorithm: ML-KEM-768
    family: Module lattice
    role: key_establishment
  ML-DSA-65:
    algorithm: ML-DSA-65
    family: Module lattice
    role: signature

# Modes appearing in cipher specification strings. ECB is flagged because it is
# unsuitable for confidentiality, independent of any quantum consideration.
cipher_modes:
  ECB:
    mode: ECB
    legacy: true
  CBC:
    mode: CBC
  GCM:
    mode: GCM
  CTR:
    mode: CTR
  CFB:
    mode: CFB
  OFB:
    mode: OFB
  CCM:
    mode: CCM
