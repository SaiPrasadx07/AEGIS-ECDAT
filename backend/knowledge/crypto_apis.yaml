  modules:
    javax.crypto:
      family: Multi
      role: multi
    java.security:
      family: Multi
      role: multi
    org.bouncycastle:
      family: Multi
      role: multi

  factories:
    Cipher.getInstance:
      family: Block cipher
      role: symmetric
    MessageDigest.getInstance:
      family: Hash
      role: hash
    Signature.getInstance:
      family: Signature
      role: signature
    KeyPairGenerator.getInstance:
      family: Multi
      role: key_establishment
    KeyAgreement.getInstance:
      family: Multi
      role: key_establishment
    KeyGenerator.getInstance:
      family: Block cipher
      role: symmetric
    SecretKeyFactory.getInstance:
      family: KDF
      role: kdf
    SSLContext.getInstance:
      family: Protocol
      role: protocol

  calls:
    KeyPairGenerator.initialize:
      family: Multi
      role: key_establishment
      note: Carries the key size for the generator created above.

