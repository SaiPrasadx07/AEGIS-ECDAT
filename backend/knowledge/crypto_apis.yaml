    role: signature
  MD5withRSA:
    algorithm: RSA
    family: RSA
    role: signature
    legacy: true
    note: The MD5 digest makes this signature construction unsuitable; RSA itself is quantum-vulnerable, which is a separate concern.
  TLS:
